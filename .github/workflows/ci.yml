name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit and markup checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    name: End-to-end in headless Chrome
    runs-on: ubuntu-latest
    # The smoke test downloads the pose models from their CDNs and runs them on
    # the CPU, so it is slower than the unit job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # GitHub's Ubuntu runners ship Google Chrome at /usr/bin/google-chrome,
      # which is where the test harnesses look for it.
      - run: npm run test:smoke
      - run: npm run test:network
